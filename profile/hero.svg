<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc">
  <title id="title">Naja Andika — Full-Stack Web Developer</title>
  <desc id="desc">Cream and deep-navy editorial banner with subtle animated entrance, teal accent, and a minimal interface illustration.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#0B3442" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FDFDF8"/>
      <stop offset="1" stop-color="#E9F2EC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="15" stdDeviation="17" flood-color="#0B3442" flood-opacity="0.13"/>
    </filter>
    <style>
      .serifless { font-family: 'Poppins', 'Inter', 'Segoe UI', Arial, sans-serif; }
      .name { animation: reveal 1.08s steps(13,end) .18s both; }
      .role { animation: reveal .85s steps(24,end) 1.12s both; }
      .fade { animation: floatin .65s ease-out .25s both; }
      .fade2 { animation: floatin .7s ease-out 1.5s both; }
      .panel { animation: panelin .85s cubic-bezier(.2,.75,.3,1) .5s both; }
      .dot { animation: pulse 2.8s ease-in-out infinite; transform-origin:center; }
      @keyframes reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
      @keyframes floatin { from { opacity: 0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
      @keyframes panelin { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform:translateY(0); } }
      @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:.45} }
      @media (prefers-reduced-motion: reduce) { *, *:before, *:after { animation: none !important; } }
    </style>
  </defs>

  <rect width="1120" height="340" rx="20" fill="#F6F5EE"/>
  <rect width="1120" height="340" rx="20" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="1118.5" height="338.5" rx="19" fill="none" stroke="#DDE4DB" stroke-width="1.5"/>
  <rect x="42" y="42" width="3" height="256" rx="1.5" fill="#176F69"/>

  <g class="serifless fade" font-size="14" font-weight="600" fill="#176F69" letter-spacing="2.3">
    <text x="73" y="84">HELLO, I'M</text>
    <path d="M215 79 H281" stroke="#176F69" stroke-width="1.5" stroke-opacity=".52"/>
  </g>

  <g class="serifless name" font-size="66" font-weight="750" fill="#0B3442" letter-spacing="-3.6">
    <text x="70" y="161">Naja Andika<tspan fill="#176F69">.</tspan></text>
  </g>

  <g class="serifless role" fill="#176F69">
    <g transform="translate(73 187)" stroke="#176F69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M7 2 1 9l6 7M15 2l6 7-6 7M13 1l-4 16"/>
    </g>
    <text x="112" y="204" font-size="21" font-weight="650" letter-spacing="-.45">Full-Stack Web Developer</text>
  </g>

  <g class="serifless fade2" font-size="15.2" fill="#34505A" font-weight="400">
    <text x="73" y="251">I build responsive, user-focused web applications</text>
    <text x="73" y="275">with Laravel, React, and thoughtful UI design.</text>
  </g>

  <g class="panel" filter="url(#shadow)">
    <rect x="702" y="61" width="346" height="220" rx="18" fill="url(#card)" stroke="#C6DAD5" stroke-width="1.5"/>
    <path d="M702 81 Q702 61 722 61 H1028 Q1048 61 1048 81 V100 H702Z" fill="#0B3442"/>
    <circle cx="724" cy="81" r="4.5" fill="#6FABA3"/>
    <circle cx="739" cy="81" r="4.5" fill="#D4E7DE"/>
    <circle cx="754" cy="81" r="4.5" fill="#D4E7DE"/>
    <path d="M722 129h43" stroke="#176F69" stroke-width="5" stroke-linecap="round"/>
    <path d="M722 151h128M722 170h97" stroke="#9ABAB3" stroke-width="7" stroke-linecap="round"/>
    <rect x="723" y="195" width="123" height="57" rx="9" fill="#0B3442"/>
    <path d="m743 222 12-10 14 17 13-14" stroke="#56C0AA" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="873" y="130" width="149" height="122" fill="#E3EFEA" stroke="#C7DBD4" stroke-width="1.2" rx="8"/>
    <rect x="889" y="148" width="62" height="11" rx="5.5" fill="#176F69" opacity=".85"/>
    <rect x="889" y="173" width="113" height="7" rx="3.5" fill="#A8C4BC"/>
    <rect x="889" y="191" width="84" height="7" rx="3.5" fill="#A8C4BC"/>
    <rect x="889" y="219" width="40" height="18" rx="9" fill="#176F69"/>
    <rect x="939" y="219" width="40" height="18" rx="9" fill="#C2DBD2"/>
  </g>
  <circle class="dot" cx="1066" cy="44" r="6" fill="#176F69"/>
</svg>