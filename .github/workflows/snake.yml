name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate themed snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: najaandika
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%237C3AED&color_dots=%23EBEDF0,%23DDD6FE,%23C4B5FD,%23A78BFA,%237C3AED
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23C4B5FD&color_dots=%230D1117,%23312E81,%234C1D95,%236D28D9,%23A78BFA

      - name: Publish snake SVGs
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
